name: Validate AI Hub dashboard
on:
  push:
    branches:
      - fix/iphone-task-detail-blank-screen
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete Node test suite
        working-directory: hub
        run: npm test
