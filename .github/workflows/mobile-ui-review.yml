name: Hub mobile UI tests and screenshots
on:
  push:
    branches:
      - feat/hub-mobile-polish-oct14
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-capture:
    if: "!contains(github.event.head_commit.message, '[visual assets]')"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out full history for the before screenshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full test suite
        working-directory: hub
        run: npm test
      - name: Install screenshot tooling (no package change)
        working-directory: hub
        run: npm install --no-save --no-audit --no-fund puppeteer-core@24
      - name: Verify browser binary
        run: which google-chrome || which chromium || which chromium-browser
      - name: Render before/after at 390px
        run: node hub/scripts/capture-dashboard.mjs
      - name: Upload 390px comparison
        uses: actions/upload-artifact@v4
        with:
          name: hub-mobile-before-after-390
          path: hub/docs/screenshots/mobile-polish/*.jpg
          retention-days: 30
      - name: Commit review screenshots to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub/docs/screenshots/mobile-polish/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "docs(ui): add iPhone before/after screenshots [visual assets]"
            git push
          fi
